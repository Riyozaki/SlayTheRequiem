<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="description">A cheerful white pelican with an orange bill rides a blue bicycle through a sunny coastal scene.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#87d9f5"/>
      <stop offset="1" stop-color="#eaf9fb"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f2b45f"/>
      <stop offset=".5" stop-color="#e99948"/>
      <stop offset="1" stop-color="#f2b45f"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffbd59"/>
      <stop offset="1" stop-color="#f17b43"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#24546a" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- scenery -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="1020" cy="118" r="60" fill="#ffe38a"/>
  <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".8">
    <path d="M105 140c20-18 40-18 60 0 20-18 40-18 60 0"/>
    <path d="M785 120c14-13 29-13 43 0 14-13 29-13 43 0"/>
    <path d="M903 214c12-11 25-11 37 0 12-11 25-11 37 0"/>
  </g>
  <path d="M0 459c130-47 223 21 347-9 122-29 234 19 351-8 153-36 244 20 502-17v169H0z" fill="#50c7cf"/>
  <path d="M0 503c107-41 191 20 304-4 103-22 201 23 318-4 148-34 276 20 578-17v90H0z" fill="#159eb4" opacity=".78"/>
  <path d="M0 558c158-37 270 25 410-1 153-28 245 26 381-6 173-39 255 18 409-12v261H0z" fill="url(#road)"/>
  <path d="M-30 671c245-44 407 57 631 0s385 45 629-3" fill="none" stroke="#ffdd8c" stroke-width="13" stroke-linecap="round" stroke-dasharray="32 32" opacity=".9"/>
  <g fill="#55b16e">
    <path d="M85 544c18-60 39-91 72-111-11 56-25 89-62 118z"/>
    <path d="M151 548c2-62 18-104 46-132 2 60-9 98-34 136z"/>
    <path d="M1066 536c9-68 32-105 70-130-6 59-24 100-57 135z"/>
    <path d="M1117 546c16-62 43-93 80-108-14 53-37 88-70 115z"/>
  </g>

  <!-- bicycle shadow -->
  <ellipse cx="602" cy="693" rx="342" ry="30" fill="#905d3c" opacity=".21"/>

  <!-- bicycle -->
  <g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
    <g fill="#fff6dc" stroke="#234a63" stroke-width="16">
      <circle cx="409" cy="622" r="105"/>
      <circle cx="795" cy="622" r="105"/>
    </g>
    <g fill="none" stroke="#8cc8d7" stroke-width="7" opacity=".9">
      <circle cx="409" cy="622" r="73"/>
      <circle cx="795" cy="622" r="73"/>
    </g>
    <g stroke="#36576b" stroke-width="6" opacity=".65">
      <path d="M409 517v210M304 622h210M335 548l148 148M483 548L335 696"/>
      <path d="M795 517v210M690 622h210M721 548l148 148M869 548L721 696"/>
    </g>
    <g fill="none" stroke="#1c6387" stroke-width="18">
      <path d="M409 622 540 466l111 156z"/>
      <path d="M540 466h144L795 622H651"/>
      <path d="M540 466 489 622"/>
    </g>
    <g stroke="#234a63" stroke-width="14" fill="none">
      <path d="M684 466l-22-55h84"/>
      <path d="M540 466l-23-45h-61"/>
    </g>
    <path d="M442 416h89" stroke="#5d3d2f" stroke-width="17"/>
    <path d="M739 408l46-2" stroke="#5d3d2f" stroke-width="17"/>
    <circle cx="651" cy="622" r="28" fill="#ffd05b" stroke="#234a63" stroke-width="11"/>
    <path d="M651 622l51 26m-51-26-39 31" stroke="#234a63" stroke-width="12"/>
    <path d="M588 665h57m55 1h58" stroke="#4a6571" stroke-width="14"/>
  </g>

  <!-- pelican -->
  <g filter="url(#shadow)" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail and body -->
    <path d="M512 419c-44 44-70 99-56 151 14 53 75 75 145 61 66-13 108-61 98-126-12-78-75-149-139-143-18 2-34 21-48 57z" fill="#f9ffff" stroke="#234a63" stroke-width="10"/>
    <path d="M503 478c14 47 40 77 84 99" fill="none" stroke="#c3e6ed" stroke-width="17"/>
    <path d="M523 432c17-50 56-90 111-89 49 1 80 42 76 88-4 49-38 82-90 88-56 6-111-28-117-87z" fill="#faffff" stroke="#234a63" stroke-width="10"/>

    <!-- head and bill -->
    <path d="M509 354c-13-52 30-101 84-95 35 4 57 25 62 58 7 48-33 87-79 90-35 2-59-19-67-53z" fill="#fbffff" stroke="#234a63" stroke-width="10"/>
    <path d="M535 336c-8-39 16-70 55-75" fill="none" stroke="#c3e6ed" stroke-width="15"/>
    <circle cx="589" cy="316" r="11" fill="#183b50"/>
    <circle cx="593" cy="312" r="3.5" fill="#fff"/>
    <path d="M627 315c67-23 166-5 199 26-23 23-79 34-145 31l-53-10z" fill="url(#bill)" stroke="#234a63" stroke-width="10"/>
    <path d="M630 362c57 10 128 0 196-21-7 55-37 92-97 95-45 2-81-19-101-64z" fill="#ff9a57" stroke="#234a63" stroke-width="10"/>
    <path d="M675 374c43 9 97 2 145-16" fill="none" stroke="#ffd37a" stroke-width="9"/>

    <!-- wing reaching handlebars -->
    <path d="M591 430c44-17 102-1 142 30 34 27 48 38 65 30l27-45c10-16 31-15 39 0 6 11 0 22-9 31l-47 55c-21 25-52 27-80 8l-65-45-49 20z" fill="#eefbfd" stroke="#234a63" stroke-width="10"/>
    <path d="M816 479c15-5 27-1 35 11" fill="none" stroke="#f9a65f" stroke-width="15"/>
    <path d="M622 447c31 8 57 25 82 52" fill="none" stroke="#c3e6ed" stroke-width="13"/>

    <!-- legs and feet -->
    <path d="M548 576l35 19 19 68" fill="none" stroke="#f19a54" stroke-width="18"/>
    <path d="M637 567l32 20 38 78" fill="none" stroke="#f19a54" stroke-width="18"/>
    <path d="M581 665h48l-26 17-44-5zM689 666h49l-29 16-40-6z" fill="#ffbd59" stroke="#234a63" stroke-width="7"/>
  </g>

  <!-- foreground dots -->
  <g fill="#fff1b1" opacity=".9">
    <circle cx="226" cy="607" r="8"/><circle cx="959" cy="622" r="7"/><circle cx="172" cy="701" r="6"/><circle cx="1040" cy="719" r="9"/>
  </g>
  <text x="600" y="755" text-anchor="middle" font-family="Verdana, sans-serif" font-size="22" font-weight="700" fill="#7b4d36" letter-spacing="5">COASTAL CRUISER</text>
</svg>
