<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 300" width="800" height="600">
  <title>Пеликан на велосипеде</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f2"/>
      <stop offset="1" stop-color="#d9f1ff"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6b93b"/>
      <stop offset="1" stop-color="#e58e26"/>
    </linearGradient>
    <g id="wheel">
      <circle r="55" fill="none" stroke="#2d3436" stroke-width="7"/>
      <circle r="50" fill="none" stroke="#636e72" stroke-width="1.5"/>
      <g stroke="#b2bec3" stroke-width="1.3">
        <line x1="0" y1="-50" x2="0" y2="50"/>
        <line x1="0" y1="-50" x2="0" y2="50" transform="rotate(30)"/>
        <line x1="0" y1="-50" x2="0" y2="50" transform="rotate(60)"/>
        <line x1="0" y1="-50" x2="0" y2="50" transform="rotate(90)"/>
        <line x1="0" y1="-50" x2="0" y2="50" transform="rotate(120)"/>
        <line x1="0" y1="-50" x2="0" y2="50" transform="rotate(150)"/>
      </g>
      <circle r="5" fill="#636e72"/>
    </g>
  </defs>

  <!-- Фон -->
  <rect width="400" height="300" fill="url(#sky)"/>
  <circle cx="345" cy="45" r="24" fill="#ffe066"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="70" cy="50" rx="30" ry="11"/>
    <ellipse cx="92" cy="42" rx="20" ry="11"/>
    <ellipse cx="300" cy="120" rx="24" ry="8"/>
  </g>
  <rect y="275" width="400" height="25" fill="#78c26b"/>
  <line x1="0" y1="275" x2="400" y2="275" stroke="#5a9e4f" stroke-width="2"/>

  <!-- Линии движения -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="10" y1="160" x2="45" y2="160"/>
    <line x1="20" y1="185" x2="48" y2="185"/>
    <line x1="5" y1="210" x2="40" y2="210"/>
  </g>

  <!-- Колёса -->
  <use xlink:href="#wheel" x="110" y="220"/>
  <use xlink:href="#wheel" x="290" y="220"/>

  <!-- Рама -->
  <g stroke="#d63031" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M110,220 L190,225 L165,145 Z"/>
    <path d="M165,145 L262,140 L270,165 L190,225"/>
    <path d="M270,165 L290,220"/>
  </g>
  <!-- Подседельный штырь и седло -->
  <line x1="165" y1="145" x2="161" y2="131" stroke="#2d3436" stroke-width="4"/>
  <path d="M142,129 Q160,124 182,129 L180,134 Q160,131 144,134 Z" fill="#2d3436"/>
  <!-- Вынос и руль -->
  <path d="M262,140 L258,118 Q250,110 240,114" stroke="#2d3436" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Дальняя нога -->
  <g stroke="#e17055" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M168,128 L196,166 L168,213"/>
  </g>
  <path d="M160,213 L178,209 L176,218 Z" fill="#e17055"/>

  <!-- Звезда и шатуны -->
  <circle cx="190" cy="225" r="14" fill="none" stroke="#2d3436" stroke-width="3"/>
  <line x1="110" y1="220" x2="190" y2="211" stroke="#636e72" stroke-width="1.5"/>
  <line x1="110" y1="220" x2="190" y2="239" stroke="#636e72" stroke-width="1.5"/>
  <line x1="168" y1="213" x2="212" y2="237" stroke="#2d3436" stroke-width="4" stroke-linecap="round"/>
  <rect x="160" y="210" width="16" height="5" rx="1" fill="#2d3436"/>
  <rect x="204" y="234" width="16" height="5" rx="1" fill="#2d3436"/>

  <!-- Пеликан -->
  <!-- Хвост -->
  <path d="M128,100 L104,90 L110,104 L102,114 L130,116 Z" fill="#dfe6e9" stroke="#636e72" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Тело -->
  <ellipse cx="168" cy="105" rx="48" ry="30" transform="rotate(-12 168 105)" fill="#ffffff" stroke="#636e72" stroke-width="2"/>
  <!-- Шея (обводка + заливка) -->
  <path d="M200,96 C218,82 204,62 226,50" stroke="#636e72" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M200,96 C218,82 204,62 226,50" stroke="#ffffff" stroke-width="18" fill="none" stroke-linecap="round"/>
  <ellipse cx="190" cy="100" rx="22" ry="18" fill="#ffffff"/>
  <!-- Крыло, тянущееся к рулю -->
  <path d="M140,92 Q175,78 206,98 Q228,108 244,113 Q228,122 200,118 Q165,122 136,112 Z" fill="#dfe6e9" stroke="#636e72" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M150,104 Q170,100 190,108 M155,112 Q175,108 195,114" stroke="#b2bec3" stroke-width="1.5" fill="none"/>
  <path d="M138,108 L128,114 L140,114 Z" fill="#2d3436"/>
  <!-- Голова -->
  <circle cx="230" cy="47" r="15" fill="#ffffff" stroke="#636e72" stroke-width="2"/>
  <path d="M222,34 Q228,26 236,33" stroke="#ffeaa7" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Клюв: подклювный мешок и надклювье -->
  <path d="M238,55 L330,74 Q305,108 262,86 Q246,76 238,55 Z" fill="#fab1a0" stroke="#e17055" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M237,40 L332,68 Q336,72 330,75 L238,56 Z" fill="url(#beak)" stroke="#d35400" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M326,66 Q338,68 332,77" fill="#d35400"/>
  <!-- Глаз -->
  <circle cx="234" cy="44" r="3.5" fill="#2d3436"/>
  <circle cx="235.2" cy="42.8" r="1.1" fill="#ffffff"/>

  <!-- Ближняя нога -->
  <g stroke="#e17055" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M182,126 L218,174 L212,237"/>
  </g>
  <path d="M204,237 L224,232 L222,242 Z" fill="#e17055"/>
</svg>
