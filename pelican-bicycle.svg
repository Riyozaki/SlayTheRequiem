<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dde3"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#f07f2a"/>
    </linearGradient>
    <g id="spokes">
      <line x1="0" y1="-84" x2="0" y2="84"/>
      <line x1="0" y1="-84" x2="0" y2="84" transform="rotate(22.5)"/>
      <line x1="0" y1="-84" x2="0" y2="84" transform="rotate(45)"/>
      <line x1="0" y1="-84" x2="0" y2="84" transform="rotate(67.5)"/>
      <line x1="0" y1="-84" x2="0" y2="84" transform="rotate(90)"/>
      <line x1="0" y1="-84" x2="0" y2="84" transform="rotate(112.5)"/>
      <line x1="0" y1="-84" x2="0" y2="84" transform="rotate(135)"/>
      <line x1="0" y1="-84" x2="0" y2="84" transform="rotate(157.5)"/>
    </g>
    <g id="wheel">
      <circle r="92" fill="none" stroke="#222" stroke-width="12"/>
      <circle r="85" fill="none" stroke="#9aa3ad" stroke-width="3"/>
      <use xlink:href="#spokes" stroke="#b8c0c8" stroke-width="1.6"/>
      <circle r="9" fill="#555"/>
      <circle r="3.5" fill="#ccc"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="95" r="48" fill="#ffe066"/>
  <circle cx="680" cy="95" r="62" fill="#ffe066" opacity="0.25"/>
  <g fill="#fff" opacity="0.9">
    <ellipse cx="140" cy="90" rx="60" ry="20"/>
    <ellipse cx="185" cy="75" rx="40" ry="22"/>
    <ellipse cx="470" cy="60" rx="50" ry="16"/>
    <ellipse cx="505" cy="50" rx="32" ry="17"/>
  </g>
  <rect y="532" width="800" height="68" fill="#7cc36a"/>
  <rect y="532" width="800" height="8" fill="#5fa84f"/>
  <ellipse cx="400" cy="540" rx="250" ry="10" fill="#000" opacity="0.15"/>

  <!-- Motion lines -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="40" y1="300" x2="120" y2="300"/>
    <line x1="20" y1="350" x2="110" y2="350"/>
    <line x1="60" y1="400" x2="130" y2="400"/>
  </g>

  <!-- Far leg (behind bicycle) -->
  <g stroke="#e0782a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="335,300 395,365 352,412"/>
  </g>
  <path d="M352,412 l-18,-4 l6,14 z" fill="#e0782a" stroke="#e0782a" stroke-width="4" stroke-linejoin="round"/>

  <!-- Wheels -->
  <use xlink:href="#wheel" x="230" y="440"/>
  <use xlink:href="#wheel" x="570" y="440"/>

  <!-- Frame -->
  <g stroke="#d7263d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="380" y1="450" x2="230" y2="440"/>   <!-- chain stay -->
    <line x1="345" y1="315" x2="230" y2="440"/>   <!-- seat stay -->
    <line x1="380" y1="450" x2="340" y2="300"/>   <!-- seat tube -->
    <line x1="345" y1="315" x2="525" y2="305"/>   <!-- top tube -->
    <line x1="380" y1="450" x2="532" y2="335"/>   <!-- down tube -->
    <line x1="520" y1="290" x2="538" y2="345"/>   <!-- head tube -->
    <line x1="538" y1="345" x2="570" y2="440"/>   <!-- fork -->
  </g>
  <!-- Stem and handlebar -->
  <g stroke="#333" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="520" y1="290" x2="514" y2="262"/>
    <path d="M514,262 Q500,252 482,258"/>
  </g>
  <line x1="482" y1="258" x2="472" y2="262" stroke="#111" stroke-width="10" stroke-linecap="round"/>
  <!-- Saddle -->
  <path d="M312,296 Q330,286 362,292 Q366,300 350,302 Q328,304 312,296 z" fill="#222"/>
  <line x1="340" y1="300" x2="338" y2="294" stroke="#333" stroke-width="6"/>

  <!-- Drivetrain -->
  <circle cx="380" cy="450" r="24" fill="none" stroke="#666" stroke-width="5"/>
  <path d="M380,426 L230,432 M380,474 L230,448" stroke="#555" stroke-width="2.5" fill="none"/>
  <circle cx="380" cy="450" r="6" fill="#444"/>
  <line x1="380" y1="450" x2="352" y2="412" stroke="#444" stroke-width="7" stroke-linecap="round"/>
  <line x1="380" y1="450" x2="408" y2="488" stroke="#444" stroke-width="7" stroke-linecap="round"/>
  <rect x="396" y="484" width="26" height="8" rx="2" fill="#222"/>

  <!-- Tail feathers -->
  <path d="M262,232 L212,214 L222,236 L205,248 L262,262 z" fill="#c9ced6" stroke="#9aa1ab" stroke-width="2" stroke-linejoin="round"/>

  <!-- Body -->
  <ellipse cx="320" cy="250" rx="78" ry="54" transform="rotate(-12 320 250)" fill="url(#body)" stroke="#9aa1ab" stroke-width="2.5"/>

  <!-- Near leg -->
  <g stroke="#f08a33" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="350,295 420,380 408,486"/>
  </g>
  <path d="M408,486 l-14,-6 l-4,8 l20,2 l20,-2 l-4,-8 z" fill="#f08a33" stroke="#f08a33" stroke-width="4" stroke-linejoin="round"/>

  <!-- Neck -->
  <path d="M352,212 C372,190 368,165 392,140 C405,128 425,128 436,140 C420,150 408,170 405,195 C402,220 385,240 368,250 z" fill="url(#body)" stroke="#9aa1ab" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Wing reaching to the handlebar -->
  <path d="M290,225 C330,205 380,210 420,232 C445,245 462,252 478,256 C470,266 445,268 420,262 C385,256 345,262 300,270 C280,262 278,238 290,225 z" fill="#eef0f3" stroke="#9aa1ab" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke="#9aa1ab" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M305,262 Q330,250 352,256"/>
    <path d="M318,246 Q345,236 372,244"/>
    <path d="M378,252 Q405,246 430,254"/>
  </g>
  <!-- Wing tip "fingers" gripping the bar -->
  <path d="M470,252 q12,-2 16,6 q-6,8 -18,8 z" fill="#2f3640"/>

  <!-- Head -->
  <ellipse cx="418" cy="132" rx="30" ry="25" fill="url(#body)" stroke="#9aa1ab" stroke-width="2.5"/>
  <!-- Crest -->
  <path d="M400,112 q-8,-14 4,-20 q2,10 10,14 z" fill="#f4e4a8" stroke="#c9b26a" stroke-width="1.5"/>

  <!-- Pouch (lower beak) -->
  <path d="M434,146 C460,200 520,214 584,168 C540,166 490,160 438,150 z" fill="url(#pouch)" stroke="#c45f17" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Upper beak -->
  <path d="M430,126 C480,132 540,146 590,160 Q600,166 588,172 C540,164 480,156 434,150 z" fill="#ffc35c" stroke="#c45f17" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="440" y1="140" x2="580" y2="164" stroke="#c45f17" stroke-width="1.5" opacity="0.6"/>

  <!-- Eye -->
  <circle cx="420" cy="126" r="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="422" cy="126" r="3.5" fill="#111"/>
  <circle cx="423" cy="124.5" r="1.2" fill="#fff"/>

  <!-- Scarf for style -->
  <path d="M376,186 Q340,176 312,196 L318,206 Q332,198 342,202 Q356,192 374,200 z" fill="#2b7bd6" stroke="#1d5ea8" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M374,178 Q392,188 412,180 L410,196 Q390,204 370,194 z" fill="#2b7bd6" stroke="#1d5ea8" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
