<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <title>Pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4f2"/>
      <stop offset="1" stop-color="#d9f0ff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bcf6a"/>
      <stop offset="1" stop-color="#5ea845"/>
    </linearGradient>
    <radialGradient id="body" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dde3"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9ecf0"/>
      <stop offset="1" stop-color="#9aa3ad"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#f07b22"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="95" r="48" fill="#ffe066"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="90" rx="60" ry="22"/>
    <ellipse cx="195" cy="75" rx="45" ry="25"/>
    <ellipse cx="520" cy="60" rx="50" ry="18"/>
    <ellipse cx="555" cy="48" rx="35" ry="20"/>
  </g>
  <rect y="500" width="800" height="100" fill="url(#ground)"/>
  <rect y="540" width="800" height="18" fill="#c9b48a" opacity="0.6"/>
  <ellipse cx="400" cy="553" rx="260" ry="12" fill="#000" opacity="0.15"/>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="30" y1="300" x2="110" y2="300"/>
    <line x1="10" y1="350" x2="90" y2="350"/>
    <line x1="50" y1="400" x2="100" y2="400"/>
  </g>

  <!-- far pedal + far leg (behind the bike) -->
  <g>
    <path d="M378 268 Q 330 360 352 440" fill="none" stroke="#e98a1f" stroke-width="10" stroke-linecap="round"/>
    <path d="M352 440 l -26 10 l 14 -18 l 14 4 l 12 -14 z" fill="#e98a1f"/>
    <line x1="390" y1="480" x2="355" y2="438" stroke="#555" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- wheels -->
  <g fill="none" stroke="#2b2b2b">
    <circle cx="230" cy="450" r="100" stroke-width="12"/>
    <circle cx="570" cy="450" r="100" stroke-width="12"/>
    <circle cx="230" cy="450" r="92" stroke-width="2" stroke="#777"/>
    <circle cx="570" cy="450" r="92" stroke-width="2" stroke="#777"/>
  </g>
  <g stroke="#b5b5b5" stroke-width="2">
    <line x1="230" y1="358" x2="230" y2="542"/>
    <line x1="138" y1="450" x2="322" y2="450"/>
    <line x1="165" y1="385" x2="295" y2="515"/>
    <line x1="165" y1="515" x2="295" y2="385"/>
    <line x1="570" y1="358" x2="570" y2="542"/>
    <line x1="478" y1="450" x2="662" y2="450"/>
    <line x1="505" y1="385" x2="635" y2="515"/>
    <line x1="505" y1="515" x2="635" y2="385"/>
  </g>
  <circle cx="230" cy="450" r="9" fill="#444"/>
  <circle cx="570" cy="450" r="9" fill="#444"/>

  <!-- frame -->
  <g stroke="#d62828" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="230,450 390,450 360,300 230,450"/>
    <line x1="390" y1="450" x2="525" y2="305"/>
    <line x1="362" y1="310" x2="525" y2="305"/>
  </g>
  <line x1="525" y1="290" x2="570" y2="450" stroke="#a61e1e" stroke-width="10" stroke-linecap="round"/>

  <!-- chain ring + chain -->
  <circle cx="390" cy="450" r="24" fill="none" stroke="#666" stroke-width="5"/>
  <path d="M230 440 L 390 426 M230 460 L 390 474" stroke="#555" stroke-width="3"/>

  <!-- seat post, saddle, stem, handlebar -->
  <line x1="360" y1="300" x2="352" y2="276" stroke="#444" stroke-width="7"/>
  <path d="M318 272 Q 350 262 382 270 Q 370 282 330 282 Z" fill="#333"/>
  <line x1="525" y1="305" x2="515" y2="255" stroke="#444" stroke-width="8" stroke-linecap="round"/>
  <path d="M515 255 Q 545 245 560 262" fill="none" stroke="#333" stroke-width="9" stroke-linecap="round"/>

  <!-- pelican body -->
  <g>
    <!-- tail -->
    <path d="M285 220 L 238 205 L 250 230 L 236 248 L 290 248 Z" fill="#c7cdd4"/>
    <!-- body -->
    <ellipse cx="360" cy="225" rx="88" ry="58" fill="url(#body)" transform="rotate(-12 360 225)"/>
    <!-- neck -->
    <path d="M410 200 C 430 150, 420 120, 445 95 L 480 112 C 462 135, 470 170, 440 215 Z" fill="url(#body)"/>
    <!-- head -->
    <ellipse cx="468" cy="102" rx="32" ry="26" fill="#ffffff"/>
    <path d="M440 88 Q 455 70 480 78 Q 470 84 462 90 Z" fill="#fff2a8"/>
    <!-- beak top -->
    <path d="M488 96 L 650 128 Q 660 132 650 138 L 492 116 Z" fill="#f6a623"/>
    <path d="M640 126 Q 664 128 652 142 L 646 134 Z" fill="#d9531e"/>
    <!-- pouch -->
    <path d="M492 116 L 646 136 Q 590 200 520 175 Q 490 160 486 128 Z" fill="url(#pouch)"/>
    <path d="M500 140 Q 560 165 620 150" fill="none" stroke="#d9711b" stroke-width="2" opacity="0.6"/>
    <!-- eye -->
    <circle cx="476" cy="96" r="7" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <circle cx="478" cy="96" r="3.8" fill="#1c1c1c"/>
    <circle cx="479.5" cy="94.5" r="1.2" fill="#ffffff"/>
    <!-- wing reaching to the handlebar -->
    <path d="M300 205 C 350 175, 430 190, 470 230 C 500 250, 530 255, 548 258 C 520 268, 480 270, 450 262 C 400 255, 340 250, 300 235 Z" fill="url(#wing)"/>
    <g stroke="#7d8791" stroke-width="2" fill="none" opacity="0.7">
      <path d="M330 222 Q 390 230 450 250"/>
      <path d="M345 210 Q 400 215 460 238"/>
    </g>
    <!-- wingtip "fingers" on the handlebar -->
    <path d="M540 254 q 12 -2 16 8 q -10 6 -18 2 z" fill="#5f6770"/>
  </g>

  <!-- near leg + near pedal (in front of the bike) -->
  <g>
    <line x1="390" y1="450" x2="425" y2="492" stroke="#444" stroke-width="7" stroke-linecap="round"/>
    <rect x="410" y="488" width="32" height="9" rx="3" fill="#333"/>
    <path d="M375 270 Q 440 360 426 486" fill="none" stroke="#f59a2b" stroke-width="11" stroke-linecap="round"/>
    <path d="M426 486 l 30 -2 l -14 -8 l 16 -8 l -18 -2 l -8 -10 z" fill="#f59a2b"/>
  </g>
  <circle cx="390" cy="450" r="7" fill="#222"/>
</svg>
