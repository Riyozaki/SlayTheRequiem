<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="600" viewBox="0 0 800 600">
  <title>Pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f2"/>
      <stop offset="1" stop-color="#d9f0ff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e6ea"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#f07a1a"/>
    </linearGradient>
    <!-- wheel spokes: one pair of lines, reused with rotations -->
    <g id="spokes" stroke="#9aa3ad" stroke-width="2">
      <line x1="-88" y1="0" x2="88" y2="0"/>
      <line x1="-88" y1="0" x2="88" y2="0" transform="rotate(22.5)"/>
      <line x1="-88" y1="0" x2="88" y2="0" transform="rotate(45)"/>
      <line x1="-88" y1="0" x2="88" y2="0" transform="rotate(67.5)"/>
      <line x1="-88" y1="0" x2="88" y2="0" transform="rotate(90)"/>
      <line x1="-88" y1="0" x2="88" y2="0" transform="rotate(112.5)"/>
      <line x1="-88" y1="0" x2="88" y2="0" transform="rotate(135)"/>
      <line x1="-88" y1="0" x2="88" y2="0" transform="rotate(157.5)"/>
    </g>
    <g id="wheel">
      <circle r="95" fill="none" stroke="#2b2b2b" stroke-width="12"/>
      <circle r="86" fill="none" stroke="#c0c6cc" stroke-width="4"/>
      <use xlink:href="#spokes"/>
      <circle r="9" fill="#555"/>
      <circle r="4" fill="#ccc"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="95" r="48" fill="#ffe066"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="90" rx="60" ry="22"/>
    <ellipse cx="195" cy="75" rx="45" ry="25"/>
    <ellipse cx="480" cy="60" rx="50" ry="18"/>
    <ellipse cx="515" cy="50" rx="35" ry="20"/>
  </g>
  <rect y="520" width="800" height="80" fill="#7cc46a"/>
  <rect y="520" width="800" height="8" fill="#5fa84f"/>
  <ellipse cx="405" cy="528" rx="250" ry="10" fill="#000" opacity="0.15"/>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="40" y1="300" x2="120" y2="300"/>
    <line x1="20" y1="350" x2="110" y2="350"/>
    <line x1="50" y1="400" x2="130" y2="400"/>
  </g>

  <!-- far-side pedal + leg (behind bike) -->
  <line x1="390" y1="440" x2="360" y2="400" stroke="#666" stroke-width="7" stroke-linecap="round"/>
  <rect x="345" y="394" width="30" height="8" rx="3" fill="#444"/>
  <path d="M352 285 L395 345 L362 396" fill="none" stroke="#d9661a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M362 396 l-18 4 l10 -10 l-8 -4 z" fill="#d9661a"/>

  <!-- wheels -->
  <use xlink:href="#wheel" transform="translate(250 430)"/>
  <use xlink:href="#wheel" transform="translate(560 430)"/>

  <!-- frame -->
  <g fill="none" stroke="#d62839" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <line x1="250" y1="430" x2="390" y2="440"/>   <!-- chain stay -->
    <line x1="250" y1="430" x2="362" y2="318"/>   <!-- seat stay -->
    <line x1="390" y1="440" x2="355" y2="300"/>   <!-- seat tube -->
    <line x1="362" y1="318" x2="520" y2="312"/>   <!-- top tube -->
    <line x1="390" y1="440" x2="527" y2="340"/>   <!-- down tube -->
    <line x1="516" y1="295" x2="530" y2="345"/>   <!-- head tube -->
    <line x1="530" y1="345" x2="560" y2="430"/>   <!-- fork -->
  </g>
  <!-- chain -->
  <path d="M250 418 L390 422 M250 442 L390 458" stroke="#444" stroke-width="3"/>
  <circle cx="390" cy="440" r="20" fill="none" stroke="#444" stroke-width="5"/>
  <!-- handlebar -->
  <path d="M516 295 L512 270 Q512 262 522 262 L552 262" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <rect x="540" y="256" width="22" height="12" rx="5" fill="#222"/>
  <!-- saddle post + saddle -->
  <line x1="355" y1="300" x2="350" y2="285" stroke="#333" stroke-width="8"/>
  <path d="M318 282 Q345 272 382 280 Q372 292 340 290 Q322 290 318 282 z" fill="#222"/>

  <!-- PELICAN -->
  <!-- tail -->
  <path d="M275 225 L235 205 L245 230 L228 245 L280 250 z" fill="#d7dbe0" stroke="#9aa3ad" stroke-width="2"/>
  <!-- body -->
  <ellipse cx="345" cy="235" rx="85" ry="58" fill="url(#body)" stroke="#9aa3ad" stroke-width="2.5" transform="rotate(-12 345 235)"/>
  <!-- neck -->
  <path d="M395 205 C420 180 405 150 425 120 C440 100 470 100 478 118 C470 135 450 145 445 170 C440 195 430 215 410 232 z" fill="url(#body)" stroke="#9aa3ad" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- head -->
  <ellipse cx="458" cy="118" rx="30" ry="24" fill="#ffffff" stroke="#9aa3ad" stroke-width="2.5"/>
  <!-- crest -->
  <path d="M440 98 Q445 82 458 92 Q462 80 472 94" fill="#fff6c8" stroke="#d9c87a" stroke-width="2"/>
  <!-- pouch -->
  <path d="M478 128 L640 140 Q600 205 520 195 Q485 188 470 150 z" fill="url(#pouch)" stroke="#c45f10" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- upper beak -->
  <path d="M474 112 L650 130 Q660 134 648 142 L478 132 z" fill="#ffcf5a" stroke="#c48a10" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M648 130 q14 4 4 16 q-2 -8 -6 -10 z" fill="#e06a10"/>
  <!-- eye -->
  <circle cx="465" cy="112" r="7" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <circle cx="467" cy="112" r="3.5" fill="#111"/>
  <circle cx="468" cy="110.5" r="1.2" fill="#fff"/>
  <!-- wing reaching to handlebar -->
  <path d="M300 200 C350 180 420 195 470 230 C495 245 520 255 545 260 C530 272 505 272 480 266 C440 280 380 285 330 265 C305 255 290 225 300 200 z" fill="#c9cfd6" stroke="#7d8790" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M330 255 C370 262 420 262 470 255 M320 235 C360 245 410 248 455 240" fill="none" stroke="#7d8790" stroke-width="2"/>
  <path d="M480 266 C505 266 528 266 545 260" fill="none" stroke="#3a3f45" stroke-width="5" stroke-linecap="round"/>

  <!-- near-side crank, pedal + leg -->
  <line x1="390" y1="440" x2="422" y2="482" stroke="#888" stroke-width="8" stroke-linecap="round"/>
  <circle cx="390" cy="440" r="7" fill="#999"/>
  <rect x="406" y="477" width="34" height="9" rx="3" fill="#333"/>
  <path d="M372 280 L438 362 L422 478" fill="none" stroke="#f07a1a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="438" cy="362" r="7" fill="#f07a1a"/>
  <path d="M422 478 l26 -6 l-6 10 l12 6 l-32 4 z" fill="#f07a1a" stroke="#c45f10" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
